services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "StrongDbPassword123!"
    ports:
      - "0.0.0.0:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8080:80"
    depends_on:
      - postgresdb
    networks:
      - devops-network
  redis-db:
    image: redis
    container_name: redis-db
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    networks:
      - devops-network
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    networks:
      - devops-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 123456
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: mssql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "123456A@"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports:
      - "0.0.0.0:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - devops-network
networks:
  devops-network:
    name: devops-network
    driver: bridge
volumes:
  postgres_data:
    external: true
    name: ifs-keycloak-broker_postgres_data
  redis-data:
    external: true
  mongo-data:
    external: true
  mssql-data:
    external: true
    name: mssql-data