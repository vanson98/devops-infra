services:
  postgres-db:
    image: postgres
    container_name: postgresdb
    environment:
      - POSTGRES_PASSWORD=123456
      - POSTGRES_USER=root
      - POSTGRES_DB=mydatabase
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql 
    networks:
      - lsc-network
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8080:80"
    depends_on:
      - postgres-db   # Ensure pgAdmin starts after postgresql db
    networks:
      - lsc-network
  redis-db:
    image: redis
    container_name: redis-db
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    networks:
      - lsc-network
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    networks:
      - lsc-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 123456
networks:
  lsc-network:
    name: lsc-network
    driver: bridge
volumes:
  pgdata:
    external: true
  redis-data:
    external: true
  mongo-data:
    external: true
